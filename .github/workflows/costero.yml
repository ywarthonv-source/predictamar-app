name: PredictaMAR Costero Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  run-costero-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install numpy pandas xarray requests scipy
          pip install gspread gspread-dataframe google-auth
          pip install copernicusmarine
          pip install earthengine-api
          pip install cdsapi
          pip install pyproj

      - name: Correr pipeline costero
        env:
          CMEMS_USER:       ${{ secrets.CMEMS_USER }}
          CMEMS_PASS:       ${{ secrets.CMEMS_PASS }}
          NASA_TOKEN:       ${{ secrets.NASA_TOKEN }}
          CDS_KEY:          ${{ secrets.CDS_KEY }}
          SHEET_ID:         ${{ secrets.SHEET_ID }}
          COSTERO_SHEET_ID: ${{ secrets.COSTERO_SHEET_ID }}
          GOOGLE_SA_JSON:   ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          cd costero
          python costero_pipeline_v10.py
