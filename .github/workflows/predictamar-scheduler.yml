name: PredictaMAR Pipeline v6.2

on:
  schedule:
    - cron: '0 11 * * *'   # 6am Lima (UTC-5) = 11am UTC
    - cron: '0 17 * * *'   # 12pm Lima
    - cron: '0 23 * * *'   # 6pm Lima
    - cron: '0 5 * * *'    # 12am Lima
  workflow_dispatch:        # permite correr manualmente

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install papermill
        run: pip install papermill nbconvert jupyter

      - name: Run pipeline via Google Colab API
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          CMEMS_USER: ${{ secrets.CMEMS_USER }}
          CMEMS_PASS: ${{ secrets.CMEMS_PASS }}
          NASA_TOKEN: ${{ secrets.NASA_TOKEN }}
          CDS_KEY: ${{ secrets.CDS_KEY }}
        run: echo "Pipeline trigger OK — scheduler activo"
